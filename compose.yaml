name: sportsbook

x-redis-service: &redis-service
  image: redis:7.4-alpine
  command:
    - redis-server
    - --appendonly
    - "yes"
    - --appendfsync
    - everysec
    - --maxmemory-policy
    - noeviction
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportsbook
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:9092 describe --status >/dev/null
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [backend]

  topic-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "/opt/sportsbook/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./docker/kafka/init-topics.sh:/opt/sportsbook/init-topics.sh:ro
      - ./docker/kafka/topics.manifest:/opt/sportsbook/topics.manifest:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]

  redis-risk:
    <<: *redis-service
    volumes:
      - redis-risk-data:/data

  redis-odds:
    <<: *redis-service
    volumes:
      - redis-odds-data:/data

  redis-wallet:
    <<: *redis-service
    volumes:
      - redis-wallet-data:/data

  redis-gateway:
    <<: *redis-service
    volumes:
      - redis-gateway-data:/data

volumes:
  postgres-data:
  kafka-data:
  redis-risk-data:
  redis-odds-data:
  redis-wallet-data:
  redis-gateway-data:

networks:
  backend:
    internal: true
