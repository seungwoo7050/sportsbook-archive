name: sportsbook

x-redis-service: &redis-service
  image: redis:7.4-alpine
  command:
    - redis-server
    - --appendonly
    - "yes"
    - --appendfsync
    - everysec
    - --maxmemory-policy
    - noeviction
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportsbook
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:9092 describe --status >/dev/null
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [backend]

  topic-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "/opt/sportsbook/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./docker/kafka/init-topics.sh:/opt/sportsbook/init-topics.sh:ro
      - ./docker/kafka/topics.manifest:/opt/sportsbook/topics.manifest:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis-risk:
        condition: service_healthy
      redis-odds:
        condition: service_healthy
      redis-wallet:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
    networks: [backend]

  secret-preflight:
    image: python:3.12-alpine
    entrypoint: ["python3", "/opt/sportsbook/check-secrets.py"]
    environment:
      GATEWAY_BETTING_API_KEY: ${GATEWAY_BETTING_API_KEY:-}
      GATEWAY_WALLET_API_KEY: ${GATEWAY_WALLET_API_KEY:-}
      BETTING_RISK_API_KEY: ${BETTING_RISK_API_KEY:-}
      BETTING_WALLET_API_KEY: ${BETTING_WALLET_API_KEY:-}
      SETTLEMENT_WALLET_API_KEY: ${SETTLEMENT_WALLET_API_KEY:-}
      ADMIN_WALLET_API_KEY: ${ADMIN_WALLET_API_KEY:-}
      ADMIN_RISK_API_KEY: ${ADMIN_RISK_API_KEY:-}
      ADMIN_ODDS_FEED_API_KEY: ${ADMIN_ODDS_FEED_API_KEY:-}
      ADMIN_SETTLEMENT_API_KEY: ${ADMIN_SETTLEMENT_API_KEY:-}
      WALLET_PLATFORM_API_KEY: ${WALLET_PLATFORM_API_KEY:-}
      INTERNAL_PLATFORM_API_KEY: ${INTERNAL_PLATFORM_API_KEY:-}
    volumes:
      - ./scripts/check-secrets.py:/opt/sportsbook/check-secrets.py:ro
      - ./config/required-secrets.txt:/opt/config/required-secrets.txt:ro
    network_mode: none

  redis-risk:
    <<: *redis-service
    volumes:
      - redis-risk-data:/data

  redis-odds:
    <<: *redis-service
    volumes:
      - redis-odds-data:/data

  redis-wallet:
    <<: *redis-service
    volumes:
      - redis-wallet-data:/data

  redis-gateway:
    <<: *redis-service
    volumes:
      - redis-gateway-data:/data

  wallet:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: wallet.jar
    environment:
      WALLET_DB_URL: jdbc:postgresql://postgres:5432/wallet
      WALLET_DB_USER: sportsbook
      WALLET_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      WALLET_KAFKA_BOOTSTRAP: kafka:9092
      WALLET_REDIS_HOST: redis-wallet
      WALLET_REDIS_PORT: "6379"
      WALLET_HTTP_PORT: "8081"
      WALLET_PLATFORM_API_KEY: ${WALLET_PLATFORM_API_KEY:-}
      WALLET_GATEWAY_API_KEY: ${GATEWAY_WALLET_API_KEY:-}
      WALLET_BETTING_SERVICE_API_KEY: ${BETTING_WALLET_API_KEY:-}
      WALLET_SETTLEMENT_SERVICE_API_KEY: ${SETTLEMENT_WALLET_API_KEY:-}
      WALLET_ADMIN_API_KEY: ${ADMIN_WALLET_API_KEY:-}
      WALLET_OUTBOX_ENABLED: "true"
      WALLET_INTEGRITY_ENABLED: "true"
      WALLET_INTEGRITY_POLL_INTERVAL: PT1S
      WALLET_RECOVERY_ENABLED: "true"
      WALLET_RECOVERY_POLL_INTERVAL: PT1S
      WALLET_RECOVERY_RETRY_BASE: PT1S
      WALLET_RECOVERY_RETRY_CAP: PT5S
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-wallet:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      secret-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8081/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8081"]
    networks: [backend]
    restart: unless-stopped

  risk:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: risk.jar
    environment:
      SERVER_PORT: "8083"
      REDIS_HOST: redis-risk
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
      INTERNAL_BETTING_SERVICE_API_KEY: ${BETTING_RISK_API_KEY:-}
      INTERNAL_ADMIN_API_KEY: ${ADMIN_RISK_API_KEY:-}
      INTERNAL_PLATFORM_API_KEY: ${INTERNAL_PLATFORM_API_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy
      redis-risk:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      secret-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8083/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8083"]
    networks: [backend]
    restart: unless-stopped

  odds:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: odds.jar
    environment:
      SERVER_PORT: "8085"
      SPRING_PROFILES_ACTIVE: mock
      REDIS_HOST: redis-odds
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_API_INTERNAL_KEY: ${ADMIN_ODDS_FEED_API_KEY:-}
      HOSTNAME: odds
      ODDSFEED_MOCK_MINUTES_PER_SECOND: "0.01"
      ODDSFEED_MOCK_SCENARIOS_AUTO_ROTATE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      redis-odds:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      secret-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8085/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8085"]
    networks: [backend]
    restart: unless-stopped

  betting:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: betting.jar
    environment:
      BETTING_DB_URL: jdbc:postgresql://postgres:5432/betting
      BETTING_DB_USER: sportsbook
      BETTING_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      BETTING_KAFKA_BOOTSTRAP: kafka:9092
      BETTING_REDIS_HOST: redis-odds
      BETTING_REDIS_PORT: "6379"
      BETTING_HTTP_PORT: "8082"
      RISK_BASE_URL: http://risk:8083
      WALLET_BASE_URL: http://wallet:8081
      BETTING_GATEWAY_API_KEY: ${GATEWAY_BETTING_API_KEY:-}
      BETTING_RISK_API_KEY: ${BETTING_RISK_API_KEY:-}
      BETTING_WALLET_API_KEY: ${BETTING_WALLET_API_KEY:-}
      BETTING_RECONCILIATION_POLL_INTERVAL_MS: "500"
      BETTING_RECONCILIATION_PENDING_TIMEOUT: PT1S
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-odds:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      wallet:
        condition: service_healthy
      risk:
        condition: service_healthy
      odds:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8082/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8082"]
    networks: [backend]
    restart: unless-stopped

  gateway:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: gateway.jar
    environment:
      GATEWAY_HTTP_PORT: "8080"
      GATEWAY_REDIS_HOST: redis-gateway
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_DATABASE: "0"
      GATEWAY_REDIS_SSL: "false"
      GATEWAY_KAFKA_BOOTSTRAP: kafka:9092
      GATEWAY_BETTING_URI: http://betting:8082
      GATEWAY_WALLET_URI: http://wallet:8081
      GATEWAY_ODDS_FEED_URI: http://odds:8085
      GATEWAY_BETTING_API_KEY: ${GATEWAY_BETTING_API_KEY:-}
      GATEWAY_WALLET_API_KEY: ${GATEWAY_WALLET_API_KEY:-}
      GATEWAY_JWT_PUBLIC_KEY: ${GATEWAY_JWT_PUBLIC_KEY:-}
      GATEWAY_TOPIC_ODDS_CHANGED: odds.changed
      GATEWAY_TOPIC_BET_SETTLED: bet.settled.v1
      GATEWAY_TOPIC_BET_VOIDED: bet.voided.v1
      GATEWAY_TOPIC_BET_RESOLUTION_REVISED: bet.resolution.revised.v1
    depends_on:
      kafka:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      wallet:
        condition: service_healthy
      odds:
        condition: service_healthy
      betting:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8080"]
    ports:
      - target: 8080
        published: ${GATEWAY_HOST_PORT:-8080}
        host_ip: 127.0.0.1
        protocol: tcp
    deploy:
      replicas: 1
    networks: [backend]
    restart: unless-stopped

  consumer-assignment:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "/opt/sportsbook/wait-consumer-assignments.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ASSIGNMENT_TIMEOUT_SECONDS: "180"
    volumes:
      - ./docker/kafka/wait-consumer-assignments.sh:/opt/sportsbook/wait-consumer-assignments.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      betting:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [backend]

  settlement:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: settlement.jar
    environment:
      SETTLEMENT_HTTP_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settlement
      SPRING_DATASOURCE_USERNAME: sportsbook
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SETTLEMENT_ADMIN_API_KEY: ${ADMIN_SETTLEMENT_API_KEY:-}
      SETTLEMENT_WALLET_API_KEY: ${SETTLEMENT_WALLET_API_KEY:-}
      SETTLEMENT_WALLET_BASE_URL: http://wallet:8081
      SETTLEMENT_WORKERS_ENABLED: "true"
      SETTLEMENT_RECOVERY_INTERVAL: PT1S
      SETTLEMENT_LEASE_DURATION: PT10S
      SETTLEMENT_BATCH_SIZE: "100"
      SETTLEMENT_OUTBOX_INTERVAL: PT0.5S
      SETTLEMENT_TOPIC_BET_PLACED: bet.placed.v1
      SETTLEMENT_TOPIC_MATCH_RESULT: match.result
      SETTLEMENT_TOPIC_EVENT_LIFECYCLE: event.lifecycle
      SETTLEMENT_TOPIC_BET_SETTLED: bet.settled.v1
      SETTLEMENT_TOPIC_BET_VOIDED: bet.voided.v1
      SETTLEMENT_TOPIC_BET_REVISED: bet.resolution.revised.v1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      wallet:
        condition: service_healthy
      consumer-assignment:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8084/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8084"]
    networks: [backend]
    restart: unless-stopped

  admin:
    build:
      context: ./docker
      dockerfile: Dockerfile.jvm
      args:
        JAR: admin.jar
    environment:
      ADMIN_HTTP_PORT: "8090"
      ADMIN_DB_URL: jdbc:postgresql://postgres:5432/admin
      ADMIN_DB_USER: sportsbook
      ADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      ADMIN_KAFKA_BOOTSTRAP: kafka:9092
      ADMIN_WALLET_BASE_URL: http://wallet:8081
      ADMIN_RISK_BASE_URL: http://risk:8083
      ADMIN_ODDS_FEED_BASE_URL: http://odds:8085
      ADMIN_SETTLEMENT_BASE_URL: http://settlement:8084
      ADMIN_WALLET_API_KEY: ${ADMIN_WALLET_API_KEY:-}
      ADMIN_RISK_API_KEY: ${ADMIN_RISK_API_KEY:-}
      ADMIN_ODDS_FEED_API_KEY: ${ADMIN_ODDS_FEED_API_KEY:-}
      ADMIN_SETTLEMENT_API_KEY: ${ADMIN_SETTLEMENT_API_KEY:-}
      ADMIN_JWT_PUBLIC_KEY: ${ADMIN_JWT_PUBLIC_KEY:-}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:-}
      ADMIN_IP_ALLOWLIST: 127.0.0.1/32,::1/128
      ADMIN_TRUSTED_PROXY_CIDRS: ""
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      wallet:
        condition: service_healthy
      risk:
        condition: service_healthy
      odds:
        condition: service_healthy
      settlement:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8090/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    expose: ["8090"]
    networks: [backend]
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  redis-risk-data:
  redis-odds-data:
  redis-wallet-data:
  redis-gateway-data:

networks:
  backend:
    internal: true
