spring:
  application:
    name: admin-api
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USER:admin}
    password: ${ADMIN_DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: admin-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${ADMIN_KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: ${ADMIN_HTTP_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      service: admin-api

logging:
  level:
    root: INFO
    com.sportsbook.admin: INFO
    org.hibernate.SQL: WARN

admin:
  security:
    jwt:
      public-key: ${ADMIN_JWT_PUBLIC_KEY:}
      issuer: ${ADMIN_JWT_ISSUER:}
    ip-allowlist: ${ADMIN_IP_ALLOWLIST:127.0.0.1/32,::1/128}
    trusted-proxy-cidrs: ${ADMIN_TRUSTED_PROXY_CIDRS:}
  downstream:
    wallet-base-url: ${ADMIN_WALLET_BASE_URL:http://localhost:8081}
    risk-base-url: ${ADMIN_RISK_BASE_URL:http://localhost:8083}
    odds-feed-base-url: ${ADMIN_ODDS_FEED_BASE_URL:http://localhost:8085}
    settlement-base-url: ${ADMIN_SETTLEMENT_BASE_URL:http://localhost:8084}
    connect-timeout: ${ADMIN_DOWNSTREAM_CONNECT_TIMEOUT:200ms}
    read-timeout: ${ADMIN_DOWNSTREAM_READ_TIMEOUT:2s}
    credentials:
      wallet-api-key: ${ADMIN_WALLET_API_KEY:}
      risk-api-key: ${ADMIN_RISK_API_KEY:}
      odds-feed-api-key: ${ADMIN_ODDS_FEED_API_KEY:}
      settlement-api-key: ${ADMIN_SETTLEMENT_API_KEY:}
