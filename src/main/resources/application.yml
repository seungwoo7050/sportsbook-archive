server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,redis,criticalDelivery
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

spring:
  application:
    name: odds-feed-service
  profiles:
    default: mock
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

oddsfeed:
  publish:
    odds-change-threshold: 0.01
    broker-ack-timeout: ${KAFKA_BROKER_ACK_TIMEOUT:5s}
  kafka:
    topics:
      odds-changed: odds.changed
      market-status-changed: market.status.changed
      event-lifecycle: event.lifecycle
      match-result: match.result
  delivery:
    stream-key: ${CRITICAL_EVENT_STREAM:oddsfeed:critical-events}
    consumer-group: ${CRITICAL_EVENT_GROUP:oddsfeed-publisher}
    consumer-name: ${HOSTNAME:oddsfeed-local}
    batch-size: 50
    claim-idle: ${CRITICAL_EVENT_CLAIM_IDLE:5s}
    poll-interval-ms: ${CRITICAL_EVENT_POLL_INTERVAL_MS:250}
  cache:
    ttl: 24h
