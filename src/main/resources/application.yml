spring:
  application:
    name: wallet-service

  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${WALLET_DB_USER:wallet}
    password: ${WALLET_DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: wallet-hikari

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
