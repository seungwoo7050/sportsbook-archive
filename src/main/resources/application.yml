server:
  port: ${SETTLEMENT_HTTP_PORT:8084}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      group-id: settlement-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: manual_immediate

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

settlement:
  admin:
    api-key: ${SETTLEMENT_ADMIN_API_KEY}
  wallet:
    api-key: ${SETTLEMENT_WALLET_API_KEY}
    base-url: ${SETTLEMENT_WALLET_BASE_URL:http://localhost:8081}
    http:
      connect-timeout: ${SETTLEMENT_WALLET_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${SETTLEMENT_WALLET_READ_TIMEOUT:PT5S}
  runtime:
    correction-window: ${SETTLEMENT_CORRECTION_WINDOW:PT24H}
    recovery-interval: ${SETTLEMENT_RECOVERY_INTERVAL:PT1S}
    lease-duration: ${SETTLEMENT_LEASE_DURATION:PT30S}
    batch-size: ${SETTLEMENT_BATCH_SIZE:100}
  outbox:
    interval: ${SETTLEMENT_OUTBOX_INTERVAL:PT1S}
  topics:
    bet-placed: ${SETTLEMENT_TOPIC_BET_PLACED:bet.placed.v1}
    match-result: ${SETTLEMENT_TOPIC_MATCH_RESULT:match.result}
    event-lifecycle: ${SETTLEMENT_TOPIC_EVENT_LIFECYCLE:event.lifecycle}
    bet-settled: ${SETTLEMENT_TOPIC_BET_SETTLED:bet.settled.v1}
    bet-voided: ${SETTLEMENT_TOPIC_BET_VOIDED:bet.voided.v1}
    bet-resolution-revised: ${SETTLEMENT_TOPIC_BET_REVISED:bet.resolution.revised.v1}
