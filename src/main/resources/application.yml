spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        http-client:
          connect-timeout: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT:500ms}
          read-timeout: ${GATEWAY_DOWNSTREAM_READ_TIMEOUT:3s}
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}
      username: ${GATEWAY_REDIS_USERNAME:}
      password: ${GATEWAY_REDIS_PASSWORD:}
      database: ${GATEWAY_REDIS_DATABASE:0}
      ssl:
        enabled: ${GATEWAY_REDIS_SSL:false}
  kafka:
    bootstrap-servers: ${GATEWAY_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${GATEWAY_KAFKA_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${GATEWAY_KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${GATEWAY_KAFKA_MAX_BLOCK_MS:5000}
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${GATEWAY_HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    use-global-registry: true
    tags:
      service: ${spring.application.name}

gateway:
  downstream:
    betting-uri: ${GATEWAY_BETTING_URI:http://localhost:8082}
    odds-feed-uri: ${GATEWAY_ODDS_FEED_URI:http://localhost:8085}
    wallet:
      uri: ${GATEWAY_WALLET_URI:http://localhost:8081}
      api-key: ${GATEWAY_WALLET_API_KEY:}
  security:
    jwt:
      public-key: ${GATEWAY_JWT_PUBLIC_KEY:}
  ratelimit:
    enabled: ${GATEWAY_RATELIMIT_ENABLED:true}
    user:
      capacity: ${GATEWAY_RATELIMIT_USER_CAPACITY:120}
      refill-period: ${GATEWAY_RATELIMIT_USER_PERIOD:1m}
    ip:
      capacity: ${GATEWAY_RATELIMIT_IP_CAPACITY:60}
      refill-period: ${GATEWAY_RATELIMIT_IP_PERIOD:1m}
    trusted-proxy-cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
  topics:
    odds-changed: ${GATEWAY_TOPIC_ODDS_CHANGED:odds.changed}
    bet-settled: ${GATEWAY_TOPIC_BET_SETTLED:bet.settled.v1}
    bet-voided: ${GATEWAY_TOPIC_BET_VOIDED:bet.voided.v1}
    bet-resolution-revised: ${GATEWAY_TOPIC_BET_RESOLUTION_REVISED:bet.resolution.revised.v1}
  kafka:
    retry-interval: ${GATEWAY_KAFKA_RETRY_INTERVAL:1s}
    retry-attempts: ${GATEWAY_KAFKA_RETRY_ATTEMPTS:2}
    dlt-wait-timeout: ${GATEWAY_KAFKA_DLT_WAIT_TIMEOUT:11s}
    dlt-timeout-buffer: ${GATEWAY_KAFKA_DLT_TIMEOUT_BUFFER:1s}
  ws:
    allowed-origins: ${GATEWAY_WS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
