spring:
  application:
    name: betting-service
  datasource:
    url: ${BETTING_DB_URL:jdbc:postgresql://localhost:5432/betting}
    username: ${BETTING_DB_USER:betting}
    password: ${BETTING_DB_PASSWORD:betting}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: betting-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${BETTING_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record
  data:
    redis:
      host: ${BETTING_REDIS_HOST:localhost}
      port: ${BETTING_REDIS_PORT:6379}
      timeout: 200ms
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${BETTING_HTTP_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      service: betting-service

betting:
  policy:
    max-selections: 15
    max-total-odds: 10000
    min-stake:
      KRW: 1000
      USD: 100
    max-stake:
      KRW: 1000000
      USD: 1000
    slippage-tolerance-percent: 3
  clients:
    risk-base-url: ${RISK_BASE_URL:http://localhost:8083}
    wallet-base-url: ${WALLET_BASE_URL:http://localhost:8081}
    connect-timeout: 200ms
    read-timeout: 500ms
    risk-api-key: ${BETTING_RISK_API_KEY}
    wallet-api-key: ${BETTING_WALLET_API_KEY}
  outbox:
    poll-interval-ms: 1000
  reconciliation:
    poll-interval-ms: 10000
    pending-timeout: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - com.sportsbook.betting.error.DependencyUnavailableException
    instances:
      riskClient:
        base-config: default
      walletClient:
        base-config: default
